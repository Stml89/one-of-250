# Response headers for AWS Amplify Hosting.
# index.html is cached for 5 minutes: repeat visits stay off AWS, and a new deploy reaches players quickly.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Cache-Control
        value: 'public, max-age=300'
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: X-Frame-Options
        value: 'SAMEORIGIN'
